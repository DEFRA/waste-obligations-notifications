name: Publish Hot Fix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.run_number != 1
    name: CDP-build-hotfix-workflow
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0
      - name: Run Consumer tests
        run: |
          dotnet build tests/Consumer.Tests/Consumer.Tests.csproj
          dotnet test --test-modules tests/Consumer.Tests/bin/Debug/net10.0/Consumer.Tests.dll --no-build
      - name: Run Consumer integration tests
        run: |
          docker compose up -d --wait
          dotnet build tests/Consumer.IntegrationTests/Consumer.IntegrationTests.csproj
          dotnet test --test-modules tests/Consumer.IntegrationTests/bin/Debug/net10.0/Consumer.IntegrationTests.dll --no-build
      - name: Require all four Notify submission previews
        env:
          GOVUKNOTIFY_APIKEY: ${{ secrets.GOVUKNOTIFY_APIKEY }}
          NOTIFY_PREVIEWS_REQUIRED: "1"
        run: |
          rm -rf TestResults/NotifySubmissionPreviews
          dotnet test --test-modules tests/Consumer.IntegrationTests/bin/Debug/net10.0/Consumer.IntegrationTests.dll --no-build --results-directory TestResults/NotifySubmissionPreviews -- --filter-class '*NotifySubmissionPreviewTests' --report-trx --report-trx-filename NotifySubmissionPreviews.trx
          python3 scripts/require-notify-previews.py TestResults/NotifySubmissionPreviews/NotifySubmissionPreviews.trx
      - name: Docker Compose logs
        if: always()
        run: docker compose logs
      - name: Stop local environment
        if: always()
        run: docker compose down -v --remove-orphans
      - name: Upload Notify preview report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: notify-preview-report
          path: TestResults/NotifySubmissionPreviews
          if-no-files-found: warn
          retention-days: 7

  sonarcloud-scan:
    name: CDP SonarCloud Scan
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/sonarcloud.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  publish:
    name: CDP-publish-hotfix-workflow
    needs: [build, sonarcloud-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      AWS_REGION: eu-west-2
      AWS_ACCOUNT_ID: "094954420758"
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Publish Hot Fix
        uses: DEFRA/cdp-build-action/build-hotfix@dfb527d1bca7591fbbfd32ac007557745e888cf2 # main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
