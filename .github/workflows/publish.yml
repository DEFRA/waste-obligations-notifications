name: Publish

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    if: github.run_number != 1
    name: CDP-build-workflow
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0
      - name: Run Consumer tests
        run: |
          dotnet build tests/Consumer.Tests/Consumer.Tests.csproj
          dotnet test --test-modules tests/Consumer.Tests/bin/Debug/net10.0/Consumer.Tests.dll --no-build
      - name: Run Consumer integration tests
        run: |
          docker compose up -d --wait
          dotnet build tests/Consumer.IntegrationTests/Consumer.IntegrationTests.csproj
          dotnet test --test-modules tests/Consumer.IntegrationTests/bin/Debug/net10.0/Consumer.IntegrationTests.dll --no-build -- --filter-not-class '*PreviewTests'
      - name: Require Notify previews
        env:
          GOVUKNOTIFY_APIKEY: ${{ secrets.GOVUKNOTIFY_APIKEY }}
          NOTIFY_PREVIEWS_REQUIRED: "1"
        run: |
          rm -rf TestResults/NotifyPreviews
          dotnet test --test-modules tests/Consumer.IntegrationTests/bin/Debug/net10.0/Consumer.IntegrationTests.dll --no-build --results-directory TestResults/NotifyPreviews -- --filter-class '*PreviewTests' --report-trx --report-trx-filename NotifyPreviews.trx
          python3 scripts/require-notify-previews.py TestResults/NotifyPreviews/NotifyPreviews.trx
      - name: Docker Compose logs
        if: always()
        run: docker compose logs
      - name: Stop local environment
        if: always()
        run: docker compose down -v --remove-orphans
      - name: Upload Notify preview report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: notify-preview-report
          path: TestResults/NotifyPreviews
          if-no-files-found: warn
          retention-days: 7

  sonarcloud-scan:
    name: CDP SonarCloud Scan
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/sonarcloud.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  publish:
    name: CDP-publish-workflow
    needs: [build, sonarcloud-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      AWS_REGION: eu-west-2
      AWS_ACCOUNT_ID: "094954420758"
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build and Publish
        uses: DEFRA/cdp-build-action/build@54ced5c5344c8b9620561a1628fe8f3d858e9871 # main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
