services:
  floci:
    image: floci/floci:latest@sha256:f5aa8c18302cedb4f2385f5c4e455b3efc77fee6bf7b6e5d1712b2817ba102db
    ports:
      - '4566:4566'
    env_file:
      - compose/aws.env
    environment:
      FLOCI_DEFAULT_REGION: eu-west-2
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  floci-init:
    image: amazon/aws-cli:latest@sha256:45056897f7c47a84e3ef5a4f9095f748bd9f5a24c5d54e7d5cfc3d4da52c9331
    entrypoint: ["/bin/sh", "/compose/init-floci.sh"]
    depends_on:
      floci:
        condition: service_healthy
    env_file:
      - compose/aws.env
    environment:
      AWS_ENDPOINT_URL: http://floci:4566
    volumes:
      - ./compose/init-floci.sh:/compose/init-floci.sh:ro
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/floci-ready"]
      interval: 2s
      timeout: 2s
      retries: 10

  mongo:
    image: mongo:7.0.43@sha256:9854f7139445d766a9523571d6f047530c45547460ffcf8259eb2bf4264632ca
    command: ["mongod", "--bind_ip_all", "--setParameter", "enableTestCommands=1"]
    ports:
      - '27017:27017'
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  notify-fixture:
    build: ./compose/notify-fixture
    ports:
      - '8086:8080'
    environment:
      FIXTURE_KEY_PATH: /fixtures/notify-api-key
    volumes:
      - notify-fixture-credentials:/fixtures
    healthcheck:
      test: ["CMD", "dotnet", "NotifyFixture.dll", "--health-check"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 5s

  consumer:
    build: .
    ports:
      - '8085:8085'
    depends_on:
      floci-init:
        condition: service_healthy
      mongo:
        condition: service_healthy
      notify-fixture:
        condition: service_healthy
    env_file:
      - compose/aws.env
    entrypoint:
      - /bin/sh
      - /fixtures/start-consumer.sh
    volumes:
      - notify-fixture-credentials:/fixtures:ro
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8085
      AWS_ENDPOINT_URL: http://floci:4566
      AnalyticsEventConsumer__ProcessingEnabled: "false"
      Acl__Clients__docker__Type: ApiKey
      Acl__Clients__docker__Secret: development-only-http-runbook-secret
      Acl__Clients__docker__Scopes__0: admin
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  submission-wiremock:
    image: sheyenrath/wiremock.net:latest@sha256:3d31cf7a0b5ad8062c9ae1ba36e2355f4b034102bd980217d5003da5effd0e10
    ports:
      - '8087:80'
      - '8088:8085'

  submission-consumer:
    build: .
    network_mode: service:submission-wiremock
    depends_on:
      submission-wiremock:
        condition: service_started
      floci-init:
        condition: service_healthy
      mongo:
        condition: service_healthy
      notify-fixture:
        condition: service_healthy
    env_file:
      - compose/aws.env
    entrypoint: [/bin/sh, /fixtures/start-consumer.sh]
    volumes:
      - notify-fixture-credentials:/fixtures:ro
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8085
      AWS_ENDPOINT_URL: http://floci:4566
      AnalyticsEventConsumer__ProcessingEnabled: "true"
      AnalyticsEventConsumer__QueueUrl: http://floci:4566/000000000000/submission_e2e_analytics_queue
      NotificationCommandDelivery__QueueUrl: http://floci:4566/000000000000/submission_e2e_commands.fifo
      NotificationCommandDelivery__EmailDeliveryCutoverUtc: "2026-09-01T00:00:00Z"
      CommandDlqAdministration__QueueUrl: http://floci:4566/000000000000/submission_e2e_commands_dlq.fifo
      Mongo__DatabaseName: submission-docker-e2e
      WasteObligations__BaseAddress: http://localhost/
      WasteOrganisations__BaseAddress: http://localhost/
      WasteOrganisations__ClientId: isolated-reader
      WasteOrganisations__ClientSecret: synthetic-read-secret
      AccountBackend__BaseAddress: http://localhost/
      AccountBackend__TokenEndpoint: http://localhost/token
      AccountBackend__ClientId: isolated-reader
      AccountBackend__ClientSecret: synthetic-read-secret
      WasteObligations__Username: isolated-docker-reader
      WasteObligations__Password: synthetic-docker-read-secret
      Notify__BaseAddress: http://localhost/
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/health"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  notify-fixture-credentials:
