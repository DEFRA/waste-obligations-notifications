services:
  floci:
    image: floci/floci:latest@sha256:f5aa8c18302cedb4f2385f5c4e455b3efc77fee6bf7b6e5d1712b2817ba102db
    ports:
      - '4566:4566'
    env_file:
      - compose/aws.env
    environment:
      FLOCI_DEFAULT_REGION: eu-west-2
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  floci-init:
    image: amazon/aws-cli:latest@sha256:45056897f7c47a84e3ef5a4f9095f748bd9f5a24c5d54e7d5cfc3d4da52c9331
    entrypoint: ["/bin/sh", "/compose/init-floci.sh"]
    depends_on:
      floci:
        condition: service_healthy
    env_file:
      - compose/aws.env
    environment:
      AWS_ENDPOINT_URL: http://floci:4566
    volumes:
      - ./compose/init-floci.sh:/compose/init-floci.sh:ro
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/floci-ready"]
      interval: 2s
      timeout: 2s
      retries: 10

  consumer:
    build: .
    ports:
      - '8085:8085'
    depends_on:
      floci-init:
        condition: service_healthy
    env_file:
      - compose/aws.env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8085
      AWS_ENDPOINT_URL: http://floci:4566
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
