services:
  floci:
    image: floci/floci:latest@sha256:e97cd0c1dc2aa14e7697fb5ef5018404c4d6345169dbd276315f0bed2c7b0520
    ports:
      - '4566:4566'
    env_file:
      - compose/aws.env
    environment:
      FLOCI_DEFAULT_REGION: eu-west-2
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  floci-init:
    image: amazon/aws-cli:latest@sha256:45056897f7c47a84e3ef5a4f9095f748bd9f5a24c5d54e7d5cfc3d4da52c9331
    entrypoint: ["/bin/sh", "/compose/init-floci.sh"]
    depends_on:
      floci:
        condition: service_healthy
    env_file:
      - compose/aws.env
    environment:
      AWS_ENDPOINT_URL: http://floci:4566
    volumes:
      - ./compose/init-floci.sh:/compose/init-floci.sh:ro
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/floci-ready"]
      interval: 2s
      timeout: 2s
      retries: 10

  mongo:
    image: mongo:7.0.43@sha256:9854f7139445d766a9523571d6f047530c45547460ffcf8259eb2bf4264632ca
    command: ["mongod", "--bind_ip_all", "--setParameter", "enableTestCommands=1"]
    ports:
      - '27017:27017'
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  notify-fixture:
    build: ./compose/notify-fixture
    ports:
      - '8086:8080'
    environment:
      FIXTURE_KEY_PATH: /fixtures/notify-api-key
    volumes:
      - notify-fixture-credentials:/fixtures
    healthcheck:
      test: ["CMD", "dotnet", "NotifyFixture.dll", "--health-check"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 5s

  consumer:
    build: .
    ports:
      - '8085:8085'
    depends_on:
      floci-init:
        condition: service_healthy
      mongo:
        condition: service_healthy
      notify-fixture:
        condition: service_healthy
    env_file:
      - compose/aws.env
    entrypoint:
      - /bin/sh
      - /fixtures/start-consumer.sh
    volumes:
      - notify-fixture-credentials:/fixtures:ro
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8085
      AWS_ENDPOINT_URL: http://floci:4566
      Acl__Clients__docker__Type: ApiKey
      Acl__Clients__docker__Secret: development-only-http-runbook-secret
      Acl__Clients__docker__Scopes__0: admin
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  notify-fixture-credentials:
